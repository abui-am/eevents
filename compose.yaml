services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eevents
      POSTGRES_USER: eevents
      POSTGRES_PASSWORD: eevents_dev_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eevents -d eevents"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - eevents-postgres:/var/lib/postgresql/data

volumes:
  eevents-postgres:
