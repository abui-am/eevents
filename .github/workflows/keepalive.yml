name: Keep deployment awake

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed health endpoint
        env:
          DEPLOYED_URL: ${{ vars.DEPLOYED_URL }}
        run: |
          if [ -z "$DEPLOYED_URL" ]; then
            echo "Set the DEPLOYED_URL repository variable to the deployed application origin."
            exit 1
          fi
          case "$DEPLOYED_URL" in
            https://*) ;;
            *) echo "DEPLOYED_URL must use HTTPS."; exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 20 "${DEPLOYED_URL%/}/api/health"
